<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flatty</title>
  </head>
  <body>
    <main id="app">
      <header id="model-toolbar">
        <nav class="control-group" aria-label="View mode">
          <button class="control-button view-mode is-active" data-view="2d" type="button" aria-pressed="true">2D</button>
          <button class="control-button view-mode" data-view="3d" type="button" aria-pressed="false">3D</button>
        </nav>
        <div class="control-group" aria-label="Model overlays">
          <button class="control-button display-toggle" data-display="labels" type="button" aria-pressed="false">Labels</button>
          <button class="control-button display-toggle" data-display="dimensions" type="button" aria-pressed="false">Dimensions</button>
        </div>
      </header>
      <div id="workspace">
        <aside id="furniture-library" aria-label="Furniture library">
          <div class="library-heading">
            <p class="eyebrow">Space planner</p>
            <h1>Furniture</h1>
            <p>Select an item, then click the 2D floor to place it.</p>
          </div>
          <div id="furniture-catalog" aria-label="Available furniture"></div>
          <p id="furniture-status" role="status">Choose an item to start.</p>
          <div id="furniture-selection-controls" hidden>
            <span id="selected-furniture-name"></span>
            <div class="selection-actions">
              <button id="rotate-furniture" class="library-action" type="button">Rotate 15°</button>
              <button id="delete-furniture" class="library-action danger" type="button">Delete</button>
            </div>
          </div>
        </aside>
        <section id="viewport" aria-label="Flat model viewport">
          <canvas id="scene"></canvas>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
